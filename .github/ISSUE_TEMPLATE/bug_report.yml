name: Bug report
description: Something in Pixel Notes isn't working
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Pixel Notes version
      description: Settings › About shows it (for example 0.12)
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone and Android version
      placeholder: Pixel 9 Pro, Android 16
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what happened instead. Album or song links help.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
