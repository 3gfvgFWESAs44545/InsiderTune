name: Build Pixel Notes APK

on:
  workflow_dispatch:
    inputs:
      dev:
        description: 'Publish as a dev build (pre-release)'
        type: boolean
        default: false
  push:
    branches: [ 'main' ]
    paths-ignore:
      - 'README.md'
      - '*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/workflows-disabled/**'

permissions:
  contents: write

concurrency:
  group: insidertune-build
  cancel-in-progress: true

jobs:
  build:
    name: Build arm64 release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # Dev builds: "[dev]" in the commit message (or the manual-run switch). They're published as
      # GitHub pre-releases, which the website's download link and the stable update channel skip.
      - name: Release channel
        id: channel
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          DISPATCH_DEV: ${{ github.event.inputs.dev }}
        run: |
          if [ "$DISPATCH_DEV" = "true" ] || echo "$COMMIT_MESSAGE" | grep -qi '\[dev\]'; then
            echo "dev=true" >> "$GITHUB_OUTPUT"; echo "suffix=-dev" >> "$GITHUB_OUTPUT"; echo "label= (dev)" >> "$GITHUB_OUTPUT"
          else
            echo "dev=false" >> "$GITHUB_OUTPUT"; echo "suffix=" >> "$GITHUB_OUTPUT"; echo "label=" >> "$GITHUB_OUTPUT"
          fi

      # Signing: the private key lives only in GitHub secrets. Either one secret named KEY holding the
      # whole pixelnotes-signing-secrets.txt file, or the four RELEASE_* secrets.
      - name: Signing key
        env:
          KEY_FILE: ${{ secrets.KEY }}
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          S_STORE_PW: ${{ secrets.RELEASE_STORE_PASSWORD }}
          S_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          S_KEY_PW: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os, sys
          env = os.environ
          values = {
              "RELEASE_KEYSTORE_BASE64": env.get("KEYSTORE_B64", ""),
              "RELEASE_STORE_PASSWORD": env.get("S_STORE_PW", ""),
              "RELEASE_KEY_ALIAS": env.get("S_ALIAS", ""),
              "RELEASE_KEY_PASSWORD": env.get("S_KEY_PW", ""),
          }
          if not values["RELEASE_KEYSTORE_BASE64"] and env.get("KEY_FILE", "").strip():
              # Parse "Name: X" / "Value: y" (value may be on the following line).
              lines = [l.strip() for l in env["KEY_FILE"].splitlines()]
              name = None
              for i, line in enumerate(lines):
                  if line.startswith("Name:"):
                      name = line[5:].strip()
                  elif line.startswith("Value:") and name in values:
                      v = line[6:].strip()
                      if not v:
                          v = next((x for x in lines[i + 1:] if x), "")
                      values[name] = v
                      name = None
          missing = [k for k, v in values.items() if not v]
          if missing:
              print("::error::Signing secrets missing: " + ", ".join(missing))
              sys.exit(1)
          for k in ("RELEASE_STORE_PASSWORD", "RELEASE_KEY_PASSWORD"):
              print("::add-mask::" + values[k])
          os.makedirs("app/keystore", exist_ok=True)
          with open("app/keystore/release.keystore", "wb") as f:
              f.write(base64.b64decode("".join(values["RELEASE_KEYSTORE_BASE64"].split())))
          with open(env["GITHUB_ENV"], "a") as f:
              f.write("STORE_PASSWORD=%s\n" % values["RELEASE_STORE_PASSWORD"])
              f.write("KEY_ALIAS=%s\n" % values["RELEASE_KEY_ALIAS"])
              f.write("KEY_PASSWORD=%s\n" % values["RELEASE_KEY_PASSWORD"])
          print("Signing with the private key from secrets")
          PY
          keytool -list -keystore app/keystore/release.keystore -storepass "$(grep ^STORE_PASSWORD= "$GITHUB_ENV" | tail -1 | cut -d= -f2-)" | grep -i "fingerprint"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Build APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleFossMobileArm64Release --stacktrace 2>&1 | tee build.log
        env:
          PULL_REQUEST: 'false'
          PIXEL_VERSION_SUFFIX: ${{ steps.channel.outputs.suffix }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      - name: Report build errors
        if: failure()
        run: |
          # Surface compiler/build errors as annotations (readable via the API).
          grep -E "^e: |^w: .*error|What went wrong|ERROR:|error: " -A2 build.log | grep -v "^--$" | head -60 > errors.txt || true
          if [ ! -s errors.txt ]; then tail -60 build.log > errors.txt; fi
          split -l 12 errors.txt chunk_
          for f in chunk_*; do
            msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' "$f")
            echo "::error title=Build error::$msg"
          done

      - name: Collect APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" -path "*release*" | head -n 1)
          if [ -z "$APK" ]; then
            echo "No APK produced"; find app/build/outputs -maxdepth 6 -print; exit 1
          fi
          VERSION="0.$(( ${{ github.run_number }} - 22 ))${{ steps.channel.outputs.suffix }}"
          mkdir -p out
          cp "$APK" "out/PixelNotes-$VERSION.apk"
          echo "path=out/PixelNotes-$VERSION.apk" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "number=0.$(( ${{ github.run_number }} - 22 ))" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelNotes-${{ steps.apk.outputs.version }}
          path: ${{ steps.apk.outputs.path }}

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ steps.apk.outputs.version }}
          name: Pixel Notes ${{ steps.apk.outputs.number }}${{ steps.channel.outputs.label }}
          body: |
            Built from ${{ github.sha }}.
            Download the APK below on your phone and open it to install.
          files: ${{ steps.apk.outputs.path }}
          prerelease: ${{ steps.channel.outputs.dev == 'true' }}
          make_latest: ${{ steps.channel.outputs.dev == 'true' && 'false' || 'true' }}

      # Stable build: remove every older release. Dev build: remove older dev builds only, so the
      # latest stable release always stays available.
      - name: Delete older releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT: v${{ steps.apk.outputs.version }}
          DEV: ${{ steps.channel.outputs.dev }}
        run: |
          gh release list -R "$GITHUB_REPOSITORY" -L 200 --json tagName,isPrerelease \
            --jq '.[] | "\(.tagName) \(.isPrerelease)"' \
            | while read -r tag pre; do
                [ "$tag" = "$CURRENT" ] && continue
                echo "$tag" | grep -qE '^(build-|v0\.)' || continue
                if [ "$DEV" = "true" ] && [ "$pre" != "true" ]; then continue; fi
                echo "Deleting $tag"
                gh release delete "$tag" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
              done
