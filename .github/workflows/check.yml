name: Check build (test branches)

# Compiles test branches without publishing a release, so main's version numbers stay in sequence.
on:
  push:
    branches: [ 'check/**' ]

concurrency:
  group: pixelnotes-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Compile check
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Build APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleFossMobileArm64Release --stacktrace 2>&1 | tee build.log
        env:
          PULL_REQUEST: 'false'
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      - name: Report build errors
        if: failure()
        run: |
          # Surface compiler/build errors as annotations (readable via the API).
          grep -E "^e: |^w: .*error|What went wrong|ERROR:|error: " -A2 build.log | grep -v "^--$" | head -60 > errors.txt || true
          if [ ! -s errors.txt ]; then tail -60 build.log > errors.txt; fi
          split -l 12 errors.txt chunk_
          for f in chunk_*; do
            msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' "$f")
            echo "::error title=Build error::$msg"
          done

